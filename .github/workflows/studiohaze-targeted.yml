name: STUDIO HAZE targeted language tests
on:
  push:
    branches: [studiohaze-targeted-ci]
permissions:
  contents: read
jobs:
  language-fixtures:
    if: github.repository == 'clavef/chroma'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 74e6b43ebaf340e92de819eb322af371729c6c8a
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false
      - name: Generate and verify two-language data-driven fixtures
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          go version
          go test -c -o /tmp/studiohaze-chroma.test ./lexers
          cd lexers
          RECORD=true /tmp/studiohaze-chroma.test -test.run '^TestLexers$/(Topaz|Lispex)' -test.v
          /tmp/studiohaze-chroma.test -test.run '^(TestEmbeddedLexerMetadata|TestLexers)$/(Topaz|Lispex)' -test.v
          cd ..
          python3 - <<'PY'
          import subprocess, base64, json
          allowed = ['lexers/testdata/topaz.expected', 'lexers/testdata/lispex.expected']
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(allowed), changed
          for path in allowed:
              tokens = json.load(open(path))
              assert not any(token['type'] == 'Error' for token in tokens), path
          patch = subprocess.check_output(['git', 'diff', '--binary', '--', *allowed])
          assert len(patch) < 200000, len(patch)
          encoded = base64.b64encode(patch).decode()
          for i in range(0, len(encoded), 6000):
              print('GENERATED_DIFF_CHUNK=' + encoded[i:i+6000], flush=True)
          subprocess.run(['git', 'add', '--', *allowed], check=True)
          print('TESTED_SOURCE_TREE=' + subprocess.check_output(['git', 'write-tree'], text=True).strip(), flush=True)
          PY

